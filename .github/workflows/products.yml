name: Сторінки товарів для Google

on:
  schedule:
    - cron: '0 */4 * * *'      # кожні 4 години
  workflow_dispatch:           # ручний запуск: Actions -> цей workflow -> Run workflow

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Згенерувати сторінки, sitemap і feed
        run: node scripts/build-products.mjs
      - name: Закомітити зміни
        id: commit
        run: |
          git config user.name "elven-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A p sitemap.xml feed.xml
          if git diff --cached --quiet; then echo "changed=no" >> "$GITHUB_OUTPUT"; else git commit -m "Оновлено сторінки товарів" && git push && echo "changed=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Запустити публікацію сайту
        if: steps.commit.outputs.changed == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
