<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Підключення… | ELVÉN</title><meta name="theme-color" content="#09090b">
<style>html,body{margin:0;height:100%;background:#09090b;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px;box-sizing:border-box;-webkit-user-select:none;user-select:none}
h1{font-weight:200;letter-spacing:.35em;margin:0;padding-left:.35em;font-size:13px;text-transform:uppercase}
p{color:#a1a1aa;font-size:13px;line-height:1.6;margin:0;max-width:290px}
button{margin-top:4px;padding:13px 24px;border:1px solid #52525b;background:transparent;color:#fff;font:600 10px Inter,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
.nl{display:block}.nr{transform-origin:100px 100px;animation:nrot 1.5s linear infinite}@keyframes nrot{to{transform:rotate(360deg)}}
.p{opacity:0;animation:nassemble 3.8s cubic-bezier(.6,0,.3,1) infinite}
@keyframes nassemble{0%{opacity:0;transform:translate(var(--x),var(--y))}28%,62%{opacity:1;transform:none}90%,100%{opacity:0;transform:translate(calc(var(--x) * -1),calc(var(--y) * -1))}}
@media (prefers-reduced-motion:reduce){.nr{animation-duration:4s}.p{animation:none;opacity:1}}</style></head>
<body><svg class="nl" viewBox="0 0 200 200" width="190" height="190" aria-hidden="true">
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="3"/>
  <circle class="nr" cx="100" cy="100" r="92" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="150 430"/>
  <g transform="translate(100 100) scale(.4) translate(-261 -221)" fill="#fff" stroke="#fff">
    <rect class="p" style="--x:-260px;--y:0" x="168" y="138" width="22" height="236" stroke="none"/>
    <rect class="p" style="--x:260px;--y:-120px;animation-delay:.12s" x="168" y="138" width="187" height="22" stroke="none"/>
    <rect class="p" style="--x:260px;--y:60px;animation-delay:.24s" x="168" y="244" width="165" height="22" stroke="none"/>
    <rect class="p" style="--x:-200px;--y:200px;animation-delay:.36s" x="168" y="352" width="187" height="22" stroke="none"/>
    <line class="p" style="--x:120px;--y:-260px;animation-delay:.48s" x1="232" y1="106" x2="282" y2="70" stroke-width="22" fill="none"/>
  </g></svg><h1>Підключення…</h1><p>Немає інтернету. Підключимось автоматично, щойно з'явиться мережа.</p><button onclick="check()">Спробувати зараз</button>
<script>
function check(){fetch('/favicon-192.png?_='+Date.now(),{cache:'no-store'}).then(function(r){if(r.ok)location.replace('/')}).catch(function(){})}
addEventListener('online',check);setInterval(check,4000);
</script></body></html>
